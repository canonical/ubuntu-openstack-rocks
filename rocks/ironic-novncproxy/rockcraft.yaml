name: ironic-novncproxy
summary: Openstack ironic-novncproxy
license: Apache-2.0
description: |
  Ubuntu distribution of OpenStack ironic-novncproxy
version: "2026.2"
# renovate: base: ubuntu:26.04@sha256:61ebaa5cc23ca45450db85eac015435199ec569e28ec222ea13f2aed2110b8a6
base: ubuntu@26.04
platforms:
  amd64:
  arm64:

package-repositories:
  - type: apt
    cloud: hibiscus
    pocket: proposed
    priority: always

services:
  ironic-novncproxy:
    override: replace
    command: ironic-novncproxy
    user: ironic
    group: ironic

parts:
  ironic-novncproxy-user:
    plugin: nil
    # 42422:42422 for kolla compatibility
    overlay-script: |
      groupadd --root $CRAFT_OVERLAY --gid 42422 --system ironic
      useradd \
        --gid 42422 \
        --uid 42422 \
        --no-create-home \
        --home /var/lib/ironic \
        --root $CRAFT_OVERLAY \
        --system \
        --shell /bin/false \
        ironic

  ironic-novncproxy:
    after: [ironic-novncproxy-user]
    plugin: nil
    overlay-packages:
      - sudo
      # ironic-api contains ironic-novncproxy
      - ironic-api
      - novnc
    prime:
      - usr/bin/ironic-novncproxy
      - usr/share/ironic/vnc-container/*
