name: masakari-consolidated
summary: Openstack masakari-consolidated
license: Apache-2.0
description: |
  Ubuntu distribution of OpenStack masakari-consolidated
version: "2026.2"
# renovate: base: ubuntu:26.04@sha256:61ebaa5cc23ca45450db85eac015435199ec569e28ec222ea13f2aed2110b8a6
base: ubuntu@26.04
platforms:
  amd64:
  arm64:
  s390x:

package-repositories:
  - type: apt
    cloud: hibiscus
    pocket: proposed
    priority: always

parts:
  masakari-user:
    plugin: nil
    # 42424:42424 for kolla compatibility
    overlay-script: |
      groupadd --root $CRAFT_OVERLAY --gid 42424 --system masakari
      useradd \
        --gid 42424 \
        --uid 42424 \
        --no-create-home \
        --home /var/lib/masakari \
        --root $CRAFT_OVERLAY \
        --system \
        --shell /bin/false \
        masakari

  masakari-consolidated:
    after: [masakari-user]
    plugin: nil
    overlay-packages:
      - sudo
      - masakari-api
      - masakari-engine
      - python3-masakari-monitors
      - python3-consul
      - apache2
      - libapache2-mod-wsgi-py3
    override-prime: |
      craftctl default
      echo > $CRAFT_PRIME/etc/apache2/ports.conf
