name: cloudkitty-consolidated
summary: Openstack cloudkitty-consolidated
license: Apache-2.0
description: |
  Ubuntu distribution of OpenStack cloudkitty-consolidated
version: "2026.2"
# renovate: base: ubuntu:26.04@sha256:61ebaa5cc23ca45450db85eac015435199ec569e28ec222ea13f2aed2110b8a6
base: ubuntu@26.04
platforms:
  amd64:
  arm64:
  s390x:

package-repositories:
  - type: apt
    cloud: hibiscus
    pocket: proposed
    priority: always

parts:
  cloudkitty-user:
    plugin: nil
    # 42408:42408 for kolla compatibility
    overlay-script: |
      groupadd --root $CRAFT_OVERLAY --gid 42408 --system cloudkitty
      useradd \
        --gid 42408 \
        --uid 42408 \
        --no-create-home \
        --home /var/lib/cloudkitty \
        --root $CRAFT_OVERLAY \
        --system \
        --shell /bin/false \
        cloudkitty

  cloudkitty-consolidated:
    after: [cloudkitty-user]
    plugin: nil
    overlay-packages:
      - sudo
      - apache2
      - libapache2-mod-wsgi-py3
      - cloudkitty-api
      - cloudkitty-processor
    override-prime: |
      craftctl default
      echo > $CRAFT_PRIME/etc/apache2/ports.conf
