name: ironic-conductor
summary: Openstack ironic-conductor
license: Apache-2.0
description: |
  Ubuntu distribution of OpenStack ironic-conductor
version: "2026.2"
# renovate: base: ubuntu:26.04@sha256:61ebaa5cc23ca45450db85eac015435199ec569e28ec222ea13f2aed2110b8a6
base: ubuntu@26.04
platforms:
  amd64:
  arm64:

package-repositories:
  - type: apt
    cloud: hibiscus
    pocket: proposed
    priority: always

services:
  ironic-conductor:
    override: replace
    command: ironic-conductor
    user: ironic
    group: ironic

parts:
  ironic-conductor-user:
    plugin: nil
    # 42422:42422 for kolla compatibility
    overlay-script: |
      groupadd --root $CRAFT_OVERLAY --gid 42422 --system ironic
      useradd \
        --gid 42422 \
        --uid 42422 \
        --no-create-home \
        --home /var/lib/ironic \
        --root $CRAFT_OVERLAY \
        --system \
        --shell /bin/false \
        ironic

  ironic-conductor:
    after: [ironic-conductor-user]
    plugin: nil
    overlay-packages:
      - sudo
      - apache2
      - ironic-conductor
      - tftpd-hpa
