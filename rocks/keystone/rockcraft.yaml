name: keystone
summary: Openstack keystone
license: Apache-2.0
description: |
  Ubuntu distribution of OpenStack keystone
version: "2026.2"
# renovate: base: ubuntu:26.04@sha256:61ebaa5cc23ca45450db85eac015435199ec569e28ec222ea13f2aed2110b8a6
base: ubuntu@26.04
platforms:
  amd64:
  arm64:
  s390x:

package-repositories:
  - type: apt
    cloud: hibiscus
    pocket: proposed
    priority: always

services:
  wsgi-keystone:
    override: replace
    command: apachectl -D FOREGROUND

parts:
  keystone-user:
    plugin: nil
    # 42425:42425 for kolla compatibility
    overlay-script: |
      groupadd --root $CRAFT_OVERLAY --gid 42425 --system keystone
      useradd \
        --gid 42425 \
        --uid 42425 \
        --no-create-home \
        --home /var/lib/keystone \
        --root $CRAFT_OVERLAY \
        --system \
        --shell /bin/false \
        keystone

  keystone:
    after: [keystone-user]
    plugin: nil
    overlay-packages:
      - sudo
      - keystone
      - libapache2-mod-auth-gssapi
      - libapache2-mod-auth-mellon
      - libapache2-mod-auth-openidc
      - libapache2-mod-oauth2
      - python3-ldappool
      - python3-requests-kerberos
    override-prime: |
      craftctl default
      echo > $CRAFT_PRIME/etc/apache2/ports.conf
