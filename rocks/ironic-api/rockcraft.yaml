name: ironic-api
summary: Openstack ironic-api
license: Apache-2.0
description: |
  Ubuntu distribution of OpenStack ironic-api
version: "2026.2"
# renovate: base: ubuntu:26.04@sha256:61ebaa5cc23ca45450db85eac015435199ec569e28ec222ea13f2aed2110b8a6
base: ubuntu@26.04
platforms:
  amd64:
  arm64:

package-repositories:
  - type: apt
    cloud: hibiscus
    pocket: proposed
    priority: always

services:
  wsgi-ironic-api:
    override: replace
    command: apachectl -D FOREGROUND

parts:
  ironic-api-user:
    plugin: nil
    # 42422:42422 for kolla compatibility
    overlay-script: |
      groupadd --root $CRAFT_OVERLAY --gid 42422 --system ironic
      useradd \
        --gid 42422 \
        --uid 42422 \
        --no-create-home \
        --home /var/lib/ironic \
        --root $CRAFT_OVERLAY \
        --system \
        --shell /bin/false \
        ironic

  ironic-api:
    after: [ironic-api-user]
    plugin: nil
    overlay-packages:
      - sudo
      - apache2
      - libapache2-mod-wsgi-py3
      - ironic-api
    override-prime: |
      craftctl default
      echo > $CRAFT_PRIME/etc/apache2/ports.conf
