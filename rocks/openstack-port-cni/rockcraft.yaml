name: openstack-port-cni
summary: OpenStack port CNI plugin
license: Apache-2.0
description: |
  A CNI plugin that wraps ovs-cni with OpenStack Neutron port management.
  Uses a thin/thick architecture where a lightweight CNI binary delegates
  OpenStack operations to a daemon over a Unix domain socket.
version: "0.1.0-7d0a487-devel"

base: bare
# renovate: build-base: ubuntu:26.04@sha256:d31acef2a964b6df1f2b7e20a1525c4f2378024e087a4f8a8a9a4247e6a79573
build-base: ubuntu@26.04

platforms:
  amd64:
  arm64:
  s390x:

parts:
  shell-tools:
    plugin: nil
    stage-packages:
      - dash_bins
      - coreutils_bins

  openstack-port-cni:
    plugin: go
    source: https://github.com/canonical/openstack-port-cni
    source-commit: 7d0a48762ebae518377ca1918a26bda1cb6c04c1
    source-type: git
    source-depth: 1
    build-environment:
      - CGO_ENABLED: "0"
      - GOFLAGS: -mod=readonly -ldflags=-s
    build-snaps:
      - go/1.25/stable
    organize:
      bin/openstack-port-cni: opt/cni/bin/openstack-port-cni
