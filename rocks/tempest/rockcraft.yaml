name: tempest
summary: OpenStack integration test suite
license: Apache-2.0
description: |
  Tempest is a set of integration tests to be run against a live OpenStack
  cluster. Tempest has batteries of tests for OpenStack API validation,
  Scenarios, and other specific tests useful in validating an OpenStack
  deployment. This ROCK is built using the snap-tempest.
version: "2026.1"

# renovate: base: ubuntu:26.04@sha256:88a381d5b5eeb2b35d3ad70925a362c37ce569daf43ede89ff818ec20e4d3794
base: ubuntu@26.04

environment:
  PYTHONPATH: /usr/lib/python3.14/site-packages

platforms:
  amd64:
  arm64:
  s390x:

parts:
  tempest-user:
    plugin: nil
    overlay-script: |
      groupadd --root $CRAFT_OVERLAY --gid 999 --system tempest
      useradd \
        --gid 999 \
        --uid 999 \
        --home-dir /var/lib/tempest \
        --root $CRAFT_OVERLAY \
        --system \
        --shell /bin/false \
        tempest
    override-prime: |
      craftctl default

      # Give permission and create the required directories
      mkdir -p $CRAFT_PRIME/var/lib/tempest
      chown -R 999:999 $CRAFT_PRIME/var/lib/tempest
    overlay-packages:
      # this must be in overlay-packages - see https://github.com/canonical/rockcraft/issues/334
      - ca-certificates # required for discover-tempest-config to download cirros image

  snap-tempest:
    after: [tempest-user]
    plugin: nil
    stage-snaps:
    - tempest/2026.1/stable
    stage-packages:
    - cron
    - iputils-ping
    - libexpat1
    stage:
    - "*"
    # Preserve the usr/bin interpreter and the base's usrmerged lib64 link.
    - "-bin/python3"
    - "-bin/python3.*"
    - "-lib64"
    override-prime: |
      craftctl default

      # set suid to utilties
      # Without this tempest user can execute ping but exits with returncode 2
      chmod u+s $CRAFT_PRIME/usr/bin/ping
