name: Publish all ROCKs from selected branch

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Build/publish only matching ROCKs
        required: false
        default: ''
        type: string


jobs:
  allrocks:
    runs-on: ubuntu-latest
    outputs:
      rocks: ${{ steps.all-rocks.outputs.rocks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Select ROCK names
        id: all-rocks
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          rocks=$(python3 .github/scripts/plan-rocks.py |
            jq -c --arg filter "$FILTER" '.rocks | map(select(test($filter)))')
          echo "rocks=$rocks" >> "$GITHUB_OUTPUT"
  build-and-publish:
    needs: allrocks
    if: ${{ needs.allrocks.outputs.rocks != '[]' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build_publish.yaml
    with:
      rocks: ${{ needs.allrocks.outputs.rocks }}
      publish: true
    secrets: inherit
