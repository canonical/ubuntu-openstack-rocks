name: Build and publish ROCKs

on:
  workflow_call:
    inputs:
      rocks:
        description: JSON list of ROCKs to build
        required: true
        type: string
      publish:
        description: Publish ROCKs to GHCR
        required: false
        default: false
        type: boolean
    secrets:
      LAUNCHPAD_SSH_PRIVATE_KEY:
        required: true
      LP_ACCESS_TOKEN:
        required: true
      LP_ACCESS_TOKEN_SECRET:
        required: true

env:
  LP_OWNER: openstack-ubuntu-testing-bot
  WATCHTOWER_SNAP_CHANNEL: latest/candidate
  LP_PREFIX: gh-rocks-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  plan:
    name: Discover ROCK variants on this ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      builds: ${{ steps.variants.outputs.builds }}
      releases: ${{ steps.variants.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: variants
        env:
          ROCKS: ${{ inputs.rocks }}
        run: |
          set -euo pipefail
          plan=$(python3 .github/scripts/plan-rocks.py --rocks "$ROCKS")
          jq -e '.builds | length > 0' <<< "$plan" >/dev/null
          echo "builds=$(jq -c '.builds' <<< "$plan")" >> "$GITHUB_OUTPUT"
          echo "releases=$(jq -c '.releases' <<< "$plan")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.variant }} ROCKs on Launchpad
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install and configure sunbeam-watchtower
        env:
          LAUNCHPAD_SSH_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sudo snap install sunbeam-watchtower --channel="${WATCHTOWER_SNAP_CHANNEL}"
          sudo snap connect sunbeam-watchtower:ssh-keys
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${LAUNCHPAD_SSH_PRIVATE_KEY}" > ~/.ssh/id_launchpad
          chmod 600 ~/.ssh/id_launchpad
          lp_host_key=$(ssh-keyscan -T 10 -t rsa git.launchpad.net 2>/dev/null)
          lp_fingerprint=$(printf '%s\n' "${lp_host_key}" | ssh-keygen -lf - | awk '{print $2}')
          if [ "${lp_fingerprint}" != 'SHA256:UNOzlP66WpDuEo34Wgs8mewypV0UzqHLsIFoqwe8dYo' ]; then
            echo '::error::Unexpected git.launchpad.net SSH host key'
            exit 1
          fi
          printf '%s\n' "${lp_host_key}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host git.launchpad.net
              IdentityFile ${HOME}/.ssh/id_launchpad
              IdentitiesOnly yes
              StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config
          git config --global user.email "openstack-testing-bot@ubuntu.com"
          git config --global user.name "Ubuntu Openstack Testing Bot"
          echo "WATCHTOWER_SSH_KEY=${HOME}/.ssh/id_launchpad" >> "$GITHUB_ENV"

      - name: Build on Launchpad and download ROCKs
        env:
          LP_ACCESS_TOKEN: ${{ secrets.LP_ACCESS_TOKEN }}
          LP_ACCESS_TOKEN_SECRET: ${{ secrets.LP_ACCESS_TOKEN_SECRET }}
          ROCKS: ${{ toJSON(matrix.rocks) }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mapfile -t rocks < <(jq -r '.[]' <<< "$ROCKS")
          git switch -c "watchtower-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${VARIANT}"
          if [[ "${VARIANT}" != primary ]]; then
            for rock in "${rocks[@]}"; do
              cp -a "rocks/${rock}/${VARIANT}/." "rocks/${rock}/"
              git add "rocks/${rock}"
            done
            # A root recipe stops Watchtower's discovery at rocks/<name>.
            # Each temporary build ref exposes one recipe per OCI image name.
            git commit -m "Select ROCK recipes for Ubuntu ${VARIANT}"
          fi
          sunbeam-watchtower --verbose --no-color \
            --config "${GITHUB_WORKSPACE}/watchtower.yaml" \
            build trigger ubuntu-openstack-rocks \
            --local-path "${GITHUB_WORKSPACE}" \
            --owner "${LP_OWNER}" \
            --prefix "${LP_PREFIX}-${VARIANT//./-}" \
            --wait --retry 2 --timeout 5h --download \
            "${rocks[@]}"

      - name: Upload downloaded ROCKs
        uses: actions/upload-artifact@v7
        with:
          name: launchpad-rocks-${{ matrix.variant }}
          path: artifacts/
          if-no-files-found: error

  stage:
    name: Stage ${{ matrix.rock }} (${{ matrix.variant }}) for publishing
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - uses: actions/checkout@v7
      - name: Download Launchpad ROCKs
        uses: actions/download-artifact@v8
        with:
          name: launchpad-rocks-${{ matrix.variant }}
          path: artifacts

      - name: Stage ROCKs for existing release workflow
        id: stage
        env:
          ROCK: ${{ matrix.rock }}
          ROCK_PATH: ${{ matrix.path }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find artifacts -type f -name "${ROCK}_*.rock" -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Launchpad produced no .rock artifacts for ${ROCK}"
            exit 1
          fi
          mapfile -t arches < <(awk '
            /^platforms:[[:space:]]*$/ { in_platforms = 1; next }
            in_platforms && /^[^[:space:]#]/ { exit }
            in_platforms && /^  [a-z0-9]+:[[:space:]]*$/ {
              sub(/^  /, ""); sub(/:[[:space:]]*$/, ""); print
            }
          ' "${ROCK_PATH}/rockcraft.yaml")
          if [ "${#arches[@]}" -eq 0 ] || [ "${#files[@]}" -ne "${#arches[@]}" ]; then
            echo "::error::Expected one ROCK per declared platform for ${ROCK}"
            exit 1
          fi
          for arch in "${arches[@]}"; do
            found=0
            for file in "${files[@]}"; do
              [[ "${file}" == *_"${arch}".rock ]] && found=$((found + 1))
            done
            if [ "${found}" -ne 1 ]; then
              echo "::error::Expected one ${arch} ROCK for ${ROCK}; found ${found}"
              exit 1
            fi
          done
          for file in "${files[@]}"; do
            cp -- "${file}" "${ROCK_PATH}/"
          done
          touch .empty
          echo "artifact-path=${ROCK_PATH//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload ROCKs
        uses: actions/upload-artifact@v7
        with:
          name: packed-rock-${{ matrix.rock }}-${{ matrix.variant }}-${{ steps.stage.outputs.artifact-path }}--platform-all
          path: |
            ${{ matrix.path }}/*.rock
            .empty
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: [plan, stage]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    uses: canonical/data-platform-workflows/.github/workflows/release_rock_edge.yaml@v53.0.0
    with:
      path-to-rock-directory: ${{ matrix.path }}
      artifact-prefix: packed-rock-${{ matrix.rock }}-${{ matrix.variant }}
    permissions:
      contents: write
      packages: write

  cleanup:
    if: ${{ always() && needs.build.result != 'skipped' }}
    needs: [build, stage, publish]
    name: Clean up temporary Launchpad resources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install sunbeam-watchtower
        run: sudo snap install sunbeam-watchtower --channel="${WATCHTOWER_SNAP_CHANNEL}"
      - name: Clean up temporary Launchpad recipe and branch
        env:
          LP_ACCESS_TOKEN: ${{ secrets.LP_ACCESS_TOKEN }}
          LP_ACCESS_TOKEN_SECRET: ${{ secrets.LP_ACCESS_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          status=0
          sunbeam-watchtower --verbose --no-color \
            --config "${GITHUB_WORKSPACE}/watchtower.yaml" \
            build cleanup \
            --project ubuntu-openstack-rocks \
            --owner "${LP_OWNER}" \
            --prefix "${LP_PREFIX}" || status=1
          # Watchtower prefixes pushed refs with "tmp-" but its branch
          # cleanup matches the supplied prefix literally.
          sunbeam-watchtower --verbose --no-color \
            --config "${GITHUB_WORKSPACE}/watchtower.yaml" \
            build cleanup \
            --project ubuntu-openstack-rocks \
            --owner "${LP_OWNER}" \
            --prefix "tmp-${LP_PREFIX}" || status=1
          exit "${status}"
