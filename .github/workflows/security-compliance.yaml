name: Security Scan and SBOM

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Which tasks to run'
        required: true
        default: 'both'
        type: choice
        options:
          - secscan
          - sbom
          - both
      branch:
        description: 'Branch to check out and build rocks from'
        required: true
        default: 'main'
      rocks:
        description: >
          JSON array of rock names to process, e.g. ["keystone","nova-api"].
          Leave empty to process all rocks.
        required: false
        default: ''

      # --- secscan inputs ---
      cycle:
        description: '[secscan] OpenStack cycle to report for (e.g., 2026.1)'
        required: false
        default: '2026.1'
      release-channel:
        description: '[secscan] Release channel of the scanned artifacts (e.g., 2026.1/edge, 2026.1/stable)'
        required: false
        default: '2026.1/edge'

      # --- SBOM inputs ---
      notification-email:
        description: '[sbom] Email address for SBOM completion notification (required when tasks is sbom or both)'
        required: false
        default: ''
      department:
        description: '[sbom] Department to associate with the generated SBOM'
        required: false
        default: 'cloud_engineering'
      team:
        description: '[sbom] Team to associate with the generated SBOM'
        required: false
        default: 'open_stack'

permissions:
  contents: read

jobs:
  check-prereqs:
    name: Check prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Verify NVD_API_KEY secret is set (secscan)
        if: ${{ inputs.tasks == 'secscan' || inputs.tasks == 'both' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [[ -z "$NVD_API_KEY" ]]; then
            echo "::error::NVD_API_KEY secret is not set. Without it NVD CVE enrichment will be"
            echo "::error::heavily rate-limited and patch information may be incomplete in results."
            echo "::error::Obtain a free key at https://nvd.nist.gov/developers/request-an-api-key"
            echo "::error::then add it under Settings -> Secrets and variables -> Actions -> New secret"
            exit 1
          fi

      - name: Verify notification-email input is set (sbom)
        if: ${{ inputs.tasks == 'sbom' || inputs.tasks == 'both' }}
        env:
          NOTIFICATION_EMAIL: ${{ inputs.notification-email }}
        run: |
          if [[ -z "$NOTIFICATION_EMAIL" ]]; then
            echo "::error::notification-email is required when tasks is 'sbom' or 'both'"
            exit 1
          fi

  list-rocks:
    name: List rocks to process
    needs: check-prereqs
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.get-rocks.outputs.recipes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: List rocks
        id: get-rocks
        env:
          ROCKS_INPUT: ${{ inputs.rocks }}
          REQUESTED_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_BRANCH" && "$REQUESTED_BRANCH" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::Select the requested branch in Run workflow so the reusable build checks out the same ref."
              exit 1
          fi
          if [[ -z "$ROCKS_INPUT" ]]; then
              # Include consolidated images and the legacy standalone scan set.
              ROCKS_INPUT=$(python3 .github/scripts/plan-rocks.py | jq -c '
                .rocks | map(select(endswith("-consolidated") or IN(
                  "consul", "glance-api", "horizon", "keystone", "neutron-server",
                  "openstack-exporter", "openstack-images-sync", "openstack-port-cni",
                  "ovs-cni-plugin", "placement-api", "rabbitmq", "skyline-apiserver", "tempest"
                )))
              ')
          fi
          plan=$(python3 .github/scripts/plan-rocks.py --rocks "$ROCKS_INPUT")
          echo "recipes=$(jq -c '.releases' <<< "$plan")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rock }} (${{ matrix.variant }})
    needs: [check-prereqs, list-rocks]
    if: ${{ needs.list-rocks.outputs.recipes != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list-rocks.outputs.recipes) }}
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@v53.0.0
    with:
      path-to-rock-directory: ${{ matrix.path }}
      artifact-prefix: packed-rock-${{ matrix.rock }}-${{ matrix.variant }}
    permissions:
      contents: read

  secscan:
    name: Secscan ${{ matrix.rock }} (${{ matrix.variant }})
    if: ${{ inputs.tasks == 'secscan' || inputs.tasks == 'both' }}
    needs: [list-rocks, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list-rocks.outputs.recipes) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download built rock artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: packed-rock-${{ matrix.rock }}-${{ matrix.variant }}-*
          merge-multiple: true
          path: rock-artifacts/

      - name: Locate OCI image and read version
        id: rock-info
        env:
          ROCK: ${{ matrix.rock }}
          ROCK_PATH: ${{ matrix.path }}
        run: |
          rock_file=$(find rock-artifacts/ -name "*_amd64.rock" | head -1)
          if [[ -z "$rock_file" ]]; then
            rock_file=$(find rock-artifacts/ -name "*.rock" | head -1)
          fi
          if [[ -z "$rock_file" ]]; then
            echo "::error::No .rock file found for $ROCK"
            exit 1
          fi
          echo "rock-file=$rock_file" >> "$GITHUB_OUTPUT"
          version=$(grep -m1 '^version:' "$ROCK_PATH/rockcraft.yaml" \
            | sed 's/version:[[:space:]]*//' | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run secscan
        id: run-secscan
        uses: canonical/cs-github-actions/run-secscan@6f2d80fda623e2fd4e83f916c85ece24e430a27f # main
        with:
          oci-image-file: ${{ steps.rock-info.outputs.rock-file }}
          oci-image-version: ${{ steps.rock-info.outputs.version }}
          product-name: ${{ matrix.rock }}
          cycle: ${{ inputs.cycle }}
          release-channel: ${{ inputs.release-channel }}
          nvd-api-key: ${{ secrets.NVD_API_KEY }}

      - name: Upload secscan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secscan-results-${{ matrix.rock }}-${{ matrix.variant }}
          path: ${{ steps.run-secscan.outputs.results-location }}
          if-no-files-found: warn

  sbom:
    name: SBOM ${{ matrix.rock }} (${{ matrix.variant }})
    if: ${{ inputs.tasks == 'sbom' || inputs.tasks == 'both' }}
    needs: [list-rocks, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list-rocks.outputs.recipes) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download built rock artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: packed-rock-${{ matrix.rock }}-${{ matrix.variant }}-*
          merge-multiple: true
          path: rock-artifacts/

      - name: Locate OCI image and compute digest
        id: rock-info
        env:
          ROCK: ${{ matrix.rock }}
        run: |
          rock_file=$(find rock-artifacts/ -name "*_amd64.rock" | head -1)
          if [[ -z "$rock_file" ]]; then
            rock_file=$(find rock-artifacts/ -name "*.rock" | head -1)
          fi
          if [[ -z "$rock_file" ]]; then
            echo "::error::No .rock file found for $ROCK"
            exit 1
          fi
          echo "rock-file=$rock_file" >> "$GITHUB_OUTPUT"
          digest="sha256:$(sha256sum "$rock_file" | awk '{print $1}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        id: generate-sbom
        uses: canonical/cs-github-actions/generate-sboms@6f2d80fda623e2fd4e83f916c85ece24e430a27f # main
        with:
          oci-image-file: ${{ steps.rock-info.outputs.rock-file }}
          oci-image-digest: ${{ steps.rock-info.outputs.digest }}
          product-name: ${{ matrix.rock }}
          notification-email: ${{ inputs.notification-email }}
          department: ${{ inputs.department }}
          team: ${{ inputs.team }}

      - name: Upload SBOM results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-results-${{ matrix.rock }}-${{ matrix.variant }}
          path: ${{ steps.generate-sbom.outputs.results-location }}
          if-no-files-found: warn
