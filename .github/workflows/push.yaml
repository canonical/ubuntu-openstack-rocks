name: Push

on:
  push:
    branches:
      - main
      - 'stable/*'

jobs:
  modified_rocks:
    uses: ./.github/workflows/modified_rocks.yaml

  build-and-publish:
    needs: modified_rocks
    if: ${{ needs.modified_rocks.outputs.rocks != '[]' }}
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/build_publish.yaml
    with:
      rocks: ${{ needs.modified_rocks.outputs.rocks }}
      publish: true
    secrets: inherit
