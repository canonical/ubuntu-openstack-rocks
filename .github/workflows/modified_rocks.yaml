name: Modified Rocks

on:
  workflow_call:
    outputs:
        rocks:
            description: List of modified rocks as a json string.
            value: ${{ jobs.modifiedrocks.outputs.rocks }}
        recipes:
            description: Build matrix for recipes belonging to modified ROCKs.
            value: ${{ jobs.modifiedrocks.outputs.recipes }}

jobs:
  modifiedrocks:
    runs-on: ubuntu-latest
    outputs:
      rocks: ${{ steps.changed-rocks.outputs.rocks }}
      recipes: ${{ steps.changed-rocks.outputs.recipes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Get changed rockcraft files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            rocks/**/rockcraft.yaml
      - name: set output
        id: changed-rocks
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }} ${{ steps.changed-files.outputs.deleted_files }}
        run: |
          set -euo pipefail
          read -ra changed_files <<< "$CHANGED_FILES"
          all_rocks=$(python3 .github/scripts/plan-rocks.py | jq -c '.rocks')
          components=()
          for file in "${changed_files[@]}"; do
              case "$file" in
                  rocks/*/rockcraft.yaml)
                      component=${file#rocks/}
                      components+=("${component%%/*}")
                      ;;
              esac
          done
          rocks=$(jq -nc --argjson all "$all_rocks" --args '
            $ARGS.positional as $changed | [$all[] | select(IN($changed[]))]
          ' -- "${components[@]}")
          plan=$(python3 .github/scripts/plan-rocks.py --rocks "$rocks")
          echo "rocks=$rocks" >> "$GITHUB_OUTPUT"
          echo "recipes=$(jq -c '.releases' <<< "$plan")" >> "$GITHUB_OUTPUT"
